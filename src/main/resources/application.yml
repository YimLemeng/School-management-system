server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: schoolManagement

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/school_management_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:your_password_here}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    serialization:
      indent-output: true
    date-format: "yyyy-MM-dd HH:mm:ss"
    time-zone: Asia/Phnom_Penh

app:
  jwt:
    secret: ${JWT_SECRET:default_secret_key_must_be_changed_in_production_32_bytes}
    expiration-milliseconds: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
