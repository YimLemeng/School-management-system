services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school_backend
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://host.docker.internal:5432/school_management_db}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-school_management}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SERVER_PORT: ${SERVER_PORT:-8080}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    ports:
      - "8080:8080"
    networks:
      - school_network

  frontend:
    build:
      context: ../school-management-frontend
      dockerfile: Dockerfile
    container_name: school_frontend
    restart: "no"
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - school_network

networks:
  school_network:
    name: school_network
    driver: bridge
